<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="../assets/favicon.svg"><title>나의 생각 노트 · 로직 링크</title><link rel="stylesheet" href="../theme/fonts.css"><link rel="stylesheet" href="../vendor/katex/katex.min.css"><link rel="stylesheet" href="../style.css"></head><body><header><div><a class="home" href="https://math-game-arcade.vercel.app/">수학 아틀리에 ↗</a><h1>로직 링크 <small>나의 생각 노트</small></h1></div><a href="../?tutorial=off">서고로 돌아가기</a></header><main class="notebook"><div class="note-nav" id="note-nav"></div><section class="brief note-mission"><div><h2 id="title"></h2><div id="question"></div></div><div id="note-figure"></div></section><div id="proof-board"></div><label for="explanation">이 순서로 놓은 이유를 한 문장으로 남겨 주세요.</label><textarea id="explanation" placeholder="이 근거가 먼저 필요한 까닭은…"></textarea><div class="actionbar"><p id="result" aria-live="polite">카드를 끌어 놓아 증명의 흐름을 완성하세요.</p><div class="actions"><button id="help">도움말</button><button id="retry">다시 놓기</button><button id="submit" class="ornate">생각 남기기</button></div></div><section class="note-result"><h2>내 기록</h2><p>순서를 이은 기록과 직접 쓴 설명이 여기에 남아요.</p><div id="report"></div><details><summary>내가 남긴 과정 보기</summary><div id="history"></div><label for="review">함께 읽고 남기는 피드백</label><textarea id="review" placeholder="잘 이어진 근거와 다시 생각해 볼 부분"></textarea><button id="save-review">피드백 저장</button><p id="review-status" role="status"></p></details><div class="actions"><button id="new-learner">새 노트 시작</button></div></section><dialog id="new-dialog"><h2>새 노트를 시작할까요?</h2><p>이 노트는 보관하고 빈 노트를 열어요. 게임 진행은 그대로예요.</p><button id="cancel-new">취소</button><button id="confirm-new">새 노트 열기</button></dialog></main><script type="module" src="app.mjs"></script></body></html>
