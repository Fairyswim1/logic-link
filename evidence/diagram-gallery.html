<!doctype html><meta charset="utf-8"><title>도형 전체 검토</title><link rel="stylesheet" href="../theme/fonts.css"><link rel="stylesheet" href="../style.css"><style>body{background:#123b42;padding:16px}nav{display:flex;gap:10px}#gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:12px}.sample{min-width:0;padding:12px;border:1px solid #aaa;border-radius:12px}.sample h2{font-size:19px}.sample p{font-size:13px;min-height:65px}.math-figure{margin:0}.math-figure svg{max-height:260px}.math-figure figcaption{font-size:12px;min-height:42px}.figure-expand{display:none}</style><nav id="pages"></nav><div id="gallery"></div><script type="module">import{levels,practice}from'../levels.mjs';import{tasks}from'../assessment/bank.mjs';import{figure}from'../figures.mjs';const all=[...levels,...tasks,practice];for(let i=0;i<8;i++)document.querySelector('#pages').innerHTML+='<button data-page="'+i+'">'+(i+1)+'</button>';function render(p){document.querySelector('#gallery').innerHTML=all.slice(p*6,p*6+6).map(t=>'<article class="sample"><h2>'+t.id+' · '+t.title+'</h2><p>'+t.problem+'</p>'+figure(t)+'</article>').join('');}document.addEventListener('click',e=>{if(e.target.dataset.page)render(+e.target.dataset.page)});render(0);</script>
